# -------------------- SECRETS --------------------
apiVersion: v1
kind: Secret
metadata:
  name: symfony-secrets
type: Opaque
data:
  # mysql://user:password@mysql-service:3306/my_database
  database-url: bXlzcWw6Ly91c2VyOnBhc3N3b3JkQG15c3FsLXNlcnZpY2U6MzMwNi9teV9kYXRhYmFzZQ==
  # Généré avec: openssl rand -hex 32 | base64
  app-secret: YWJjZGVmZ2hpams2bG1ub3BxcnN0dXZ3eHl6MTIzNDU2Nzg5MA==
#  password
  database_password: cGFzc3dvcmQ=
#  user
  database_username: dXNlcg==
#  my_database
  database_name: bXlkYXRhYmFzZQ==

---
# -------------------- PERSISTENT VOLUME CLAIM --------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# -------------------- DÉPLOIEMENT MYSQL --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          env:
            - name: MYSQL_USER
              value: database_username
            - name: MYSQL_PASSWORD
              value: database_password
            - name: MYSQL_DATABASE
              value: database_name
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql/data

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc

---
# -------------------- SERVICE POSTGRESQL --------------------
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

---
# -------------------- DEPLOIEMENT SYMFONY --------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-app
  labels:
    app: symfony-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: symfony-app
  template:
    metadata:
      labels:
        app: symfony-app
    spec:
      # Attendre que PostgreSQL soit prêt avant de démarrer Symfony
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - sh
            - -c
            - |
              until mysql_isready -h mysql-service -p 3306 -U user; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: symfony-app
          image: maxxa/k3s:latest
          ports:
            - containerPort: 80
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: symfony-secrets
                  key: database-url
            - name: APP_ENV
              value: "prod"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: symfony-secrets
                  key: app-secret
          # Health checks pour Symfony
          livenessProbe:
            httpGet:
              path: /article
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /article
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

---
# -------------------- SERVICE SYMFONY --------------------
apiVersion: v1
kind: Service
metadata:
  name: symfony-service
spec:
  selector:
    app: symfony-app
  ports:
    - port: 80
      targetPort: 80
      # Ajout d'un nodePort pour accès externe si nécessaire
      nodePort: 30080
  type: LoadBalancer